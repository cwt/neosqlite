[mypy]
python_version = 3.10
mypy_path = typings
ignore_missing_imports = True

# Typed rollout (#typed): bodies of untyped functions ARE checked now.
# The neosqlite/ package passes cleanly under this setting.
check_untyped_defs = True

# Demo scripts are not part of the distributed library
exclude = (?x)(
    ^examples/
    | ^tests/
    | ^packages/nx_27017/tests/
  )

[mypy-examples.*]
ignore_missing_imports = True

[mypy-tests.*]
ignore_missing_imports = True
